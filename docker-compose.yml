services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sales_inventory
      JWT_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      CLIENT_URL: http://localhost:5173
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_SOCKET_URL: http://localhost:4000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
